name = "matrix-bot"
main = "index.ts"
compatibility_date = "2026-07-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[alias]
"@matrix-org/matrix-sdk-crypto-wasm" = "@ixo/matrix-bot-workers-sdk/crypto-wasm-shim"

[observability]
enabled = true

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

[vars]
MATRIX_HOMESERVER_URL = "https://matrix.anarchists.space"
MATRIX_USER_ID = "@fatih:matrix.anarchists.space"
MATRIX_DEVICE_DISPLAY_NAME = "matrix-bot"
MATRIX_BACKFILL_MAX_EVENTS = "20"
LOG_LEVEL = "info"
MEOW_BASE_URL = "https://meow.plz.pet/"
BARK_BASE_URL = "https://bark.plz.pet/"

[[durable_objects.bindings]]
name = "BOT_DO"
class_name = "MatrixBot"

[[durable_objects.bindings]]
name = "REMINDER_DO"
class_name = "ReminderStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatrixBot"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ReminderStore"]
